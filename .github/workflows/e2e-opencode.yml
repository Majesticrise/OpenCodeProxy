name: e2e-opencode

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js (for opencode CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Show opencode version
        run: opencode --version || true

      - name: Start opencode serve (sidecar)
        run: |
          opencode serve --port 8911 --hostname 127.0.0.1 > /tmp/opencode.log 2>&1 &
          echo $! > /tmp/opencode.pid
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8911/global/health > /dev/null; then
              echo "opencode serve is up"
              break
            fi
            sleep 1
          done
          echo "---- opencode serve startup log ----"
          cat /tmp/opencode.log || true

      # ===== 诊断步骤 1：直接打 serve 的非流式，看原始响应 =====
      - name: "[diag] Direct call to opencode serve (non-stream)"
        continue-on-error: true
        run: |
          echo "===== POST /chat/completions (stream:false) ====="
          curl -sS -X POST http://127.0.0.1:8911/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mimo-v2.6-flash-free","messages":[{"role":"user","content":"hi"}],"stream":false}' \
            | tee /tmp/serve_nostream.json
          echo
          echo "===== POST /v1/chat/completions (stream:false) ====="
          curl -sS -X POST http://127.0.0.1:8911/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mimo-v2.6-flash-free","messages":[{"role":"user","content":"hi"}],"stream":false}' \
            | tee /tmp/serve_v1_nostream.json
          echo

      # ===== 诊断步骤 2：直接打 serve 的流式，看 SSE 事件形状 =====
      - name: "[diag] Direct call to opencode serve (stream, first 40 lines)"
        continue-on-error: true
        run: |
          echo "===== POST /chat/completions (stream:true), first 40 lines ====="
          curl -sN -X POST http://127.0.0.1:8911/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mimo-v2.6-flash-free","messages":[{"role":"user","content":"hi"}],"stream":true}' \
            | head -40 | tee /tmp/serve_stream.txt

      # ===== 诊断步骤 3：列出 serve 暴露的端点（如果它提供 API 目录） =====
      - name: "[diag] Probe serve endpoints"
        continue-on-error: true
        run: |
          for path in / /doc /openapi.json /api /v1/models /models; do
            code=$(curl -s -o /tmp/probe.out -w '%{http_code}' "http://127.0.0.1:8911$path" || echo "ERR")
            echo "GET $path -> $code"
            head -c 300 /tmp/probe.out 2>/dev/null || true
            echo
          done

      - name: Build Rust proxy
        run: cargo build --release

      - name: Start Rust proxy (pointing to local opencode)
        run: |
          ZEN_UPSTREAM=http://127.0.0.1:8911 \
          ./target/release/zen-proxy > /tmp/zen-proxy.log 2>&1 &
          echo $! > /tmp/zen-proxy.pid
          sleep 3
          echo "---- zen-proxy startup log ----"
          cat /tmp/zen-proxy.log || true

      - name: Probe /v1/chat/completions
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8910/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"mimo-v2.6-flash-free","messages":[{"role":"user","content":"hi"}],"stream":false}')
          echo "status=$code"
          cat /tmp/resp.json
          if [ "$code" = "403" ]; then
            echo "403 FreeTierError still present"
            exit 1
          fi

      - name: "[diag] Show zen-proxy logs after probe"
        if: always()
        continue-on-error: true
        run: |
          echo "---- zen-proxy log (last 100 lines) ----"
          tail -100 /tmp/zen-proxy.log || true
          echo "---- opencode serve log (last 100 lines) ----"
          tail -100 /tmp/opencode.log || true

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/zen-proxy.pid) 2>/dev/null || true
          kill $(cat /tmp/opencode.pid) 2>/dev/null || true