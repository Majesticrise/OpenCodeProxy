name: Build and Release

on:
  push:
    tags:
      - 'v*'           # 推送 v1.2.6 这样的标签时触发自动发布
  workflow_dispatch:    # 也支持在 GitHub Actions 页面手动点击运行

permissions:
  contents: write       # 允许创建 Release 和上传附件

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows 版本 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zen-proxy.exe
            release_name: zen-proxy-windows.exe

          # Linux 静态版本 (Musl，免依赖，兼容群晖/NAS)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: zen-proxy
            release_name: zen-proxy-linux-musl

          # macOS Intel 版本
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: zen-proxy
            release_name: zen-proxy-macos-intel

          # macOS Apple Silicon 版本 (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zen-proxy
            release_name: zen-proxy-macos-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Linux 编译依赖 (仅限 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 缓存 Rust 依赖 (大幅加速编译)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译 Release 版本
        run: cargo build --release --target ${{ matrix.target }}

      - name: 准备上传产物
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.release_name }}

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: artifacts/${{ matrix.release_name }}

      - name: 发布到 GitHub Release (仅当推送 Tag 时)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/${{ matrix.release_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
