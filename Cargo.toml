[package]
name = "zen-proxy"
version = "1.2.6"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
wreq = { version = "0.16", features = ["json", "stream", "socks", "cookies"] }
wreq-util = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1.5"
tokio-stream = "0.1"
lazy_static = "1.4"
dashmap = "5"
hex = "0.4"